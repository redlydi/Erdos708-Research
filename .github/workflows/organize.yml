name: Organize research files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Organize files
        run: |
          set -euo pipefail

          mkdir -p reports code verification

          move_file() {
            if [ -f "$1" ]; then
              if [ -e "$2" ]; then
                echo "Conflict: $2 already exists"
                exit 1
              fi
              git mv "$1" "$2"
            fi
          }

          move_file REPORT.md reports/REPORT.md

          move_file check.py code/check.py
          move_file archive_g3.py code/archive_g3.py
          move_file archive_repetitions.py code/archive_repetitions.py

          move_file check_output.txt verification/check_output.txt
          move_file archive_g3_output.txt verification/archive_g3_output.txt
          move_file archive_repetitions_output.txt verification/archive_repetitions_output.txt

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Organize research repository"
            git push origin HEAD:main
          fi
